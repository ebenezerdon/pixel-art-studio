<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pixel Art Studio — Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="styles/main.css">
  <style type="text/tailwindcss" data-teda="tailwind-apply">
    @layer components {
      .btn-primary { @apply inline-flex items-center justify-center gap-2 text-white px-3 py-2 rounded-md shadow focus:outline-none; background-color: var(--accent-primary); }
      .btn-primary:hover { background-color: var(--accent-primary-dark); }
      .btn-primary:focus { box-shadow: 0 0 0 6px var(--accent-primary-ring); }
      .btn-ghost { @apply inline-flex items-center gap-2 bg-white border border-gray-200 text-sm px-2 py-1 rounded-md hover:bg-gray-50; }
      .tool { @apply w-10 h-10 flex items-center justify-center rounded-md border border-transparent focus:outline-none; background-color: transparent; border-color: rgba(0,0,0,0.03); }
      .tool[aria-pressed="true"], .tool:focus{ box-shadow: inset 0 -2px 0 rgba(0,0,0,0.06); border-color: var(--accent-primary-ring); }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="inline-flex items-center gap-2 text-slate-700">
          <svg width="28" height="28" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect width="64" height="64" rx="12" fill="var(--accent-warm)"></rect>
            <g transform="translate(16,16)">
              <rect x="0" y="0" width="10" height="10" rx="2" fill="var(--accent-primary)"></rect>
              <rect x="14" y="0" width="10" height="10" rx="2" fill="var(--accent-primary-dark)"></rect>
              <rect x="28" y="0" width="10" height="10" rx="2" fill="var(--muted)"></rect>

              <rect x="0" y="14" width="10" height="10" rx="2" fill="var(--accent-secondary)"></rect>
              <rect x="14" y="14" width="10" height="10" rx="2" fill="transparent" stroke="var(--accent-primary)" stroke-width="1"></rect>
              <rect x="28" y="14" width="10" height="10" rx="2" fill="var(--accent-primary)"></rect>

              <rect x="0" y="28" width="10" height="10" rx="2" fill="var(--accent-warm-dark)"></rect>
              <rect x="14" y="28" width="10" height="10" rx="2" fill="var(--accent-primary)"></rect>
              <rect x="28" y="28" width="10" height="10" rx="2" fill="var(--accent-secondary)"></rect>
            </g>
          </svg>
          <span class="font-semibold">Pixel Art Studio</span>
        </a>
      </div>
      <div class="flex items-center gap-3">
        <button id="btn-new" class="btn-ghost" title="New project">New</button>
        <button id="btn-save" class="btn-ghost" title="Save">Save</button>
        <a id="btn-export" class="btn-primary" href="#" role="button">Export PNG</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 grid gap-6 md:grid-cols-[3fr_1fr]">
    <!-- left: editor (about 75%) -->
    <section class="bg-white rounded-2xl p-4 shadow-sm min-h-[60vh]">
      <div class="flex items-center justify-between mb-4 gap-4">
        <div class="flex items-center gap-3">
          <label class="text-sm text-slate-600">Grid:</label>
          <select id="input-grid-size" class="rounded-md border px-2 py-1 text-sm">
            <option value="16">16 x 16</option>
            <option value="24">24 x 24</option>
            <option value="32" selected>32 x 32</option>
            <option value="48">48 x 48</option>
          </select>
          <label class="text-sm text-slate-600">Pixel scale:</label>
          <input id="input-scale" type="range" min="6" max="24" value="12" class="w-36">
          <span id="scale-label" class="text-sm text-slate-500">12 px</span>
        </div>

        <div class="flex items-center gap-2">
          <button id="tool-pencil" class="tool" aria-pressed="true" title="Pencil">✏️</button>
          <button id="tool-eraser" class="tool" title="Eraser">🧽</button>
          <button id="tool-fill" class="tool" title="Fill">🪣</button>
          <button id="tool-picker" class="tool" title="Color picker">🎯</button>
        </div>
      </div>

      <div id="canvas-wrap" class="rounded-md border border-slate-100 bg-slate-50 p-4 flex justify-center items-center overflow-auto">
        <!-- grid container created dynamically -->
        <div id="pixel-grid" class="select-none touch-none" aria-label="Pixel drawing grid"></div>
      </div>

      <div class="mt-4 flex items-center justify-between">
        <div class="text-sm text-slate-600">Tip: Click and drag to paint. Hold Shift for straight lines.</div>
        <div class="flex items-center gap-2">
          <button id="btn-undo" class="btn-ghost">Undo</button>
          <button id="btn-redo" class="btn-ghost">Redo</button>
          <button id="btn-clear" class="btn-ghost">Clear</button>
        </div>
      </div>
    </section>

    <!-- right: palette & layers (about 25%) -->
    <aside class="space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <h3 class="font-semibold">Palette</h3>
          <button id="btn-add-color" class="btn-ghost">+ Add</button>
        </div>
        <div id="palette" class="mt-3 grid grid-cols-6 gap-2" aria-label="Color palette"></div>
        <div class="mt-3">
          <input id="color-picker" type="color" class="w-full h-9 p-0 border-0 rounded-md" aria-label="Pick a color">
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <h3 class="font-semibold">Layers</h3>
          <div>
            <button id="btn-add-layer" class="btn-ghost">+ Layer</button>
          </div>
          <div class="flex-none w-14 h-14 rounded-lg grid place-items-center font-bold" style="background-color:var(--accent-warm-muted); color:var(--accent-warm-dark)">L</div>
        <div id="layers" class="mt-3 space-y-2" aria-label="Layer list"></div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <h3 class="font-semibold">Export</h3>
        <div class="mt-3 text-sm text-slate-600">Scale</div>
        <select id="export-scale" class="mt-2 rounded-md border px-2 py-1 text-sm w-full">
          <option value="1">1x (native)</option>
          <option value="2" selected>2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
        </select>
        <div class="mt-3">
          <label class="text-sm text-slate-600">Filename</label>
          <input id="export-name" class="w-full mt-1 rounded-md border px-2 py-1 text-sm" value="pixel-art.png">
        </div>
      </div>
    </aside>
  </main>

  <template id="layer-item-template">
    <div class="flex items-center justify-between gap-3 bg-slate-50 rounded-md p-2 border border-transparent hover:border-slate-100">
      <div class="flex items-center gap-2">
        <button class="layer-vis toggle-visibility" title="Toggle visibility">👁️</button>
        <input class="layer-name bg-transparent text-sm px-1" />
      </div>
      <div class="flex items-center gap-1">
        <button class="btn-ghost layer-up" title="Move up">▲</button>
        <button class="btn-ghost layer-down" title="Move down">▼</button>
        <button class="btn-ghost layer-delete" title="Delete">🗑️</button>
      </div>
    </div>
  </template>

  <script src="scripts/helpers.js"></script>
  <script src="scripts/data.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
